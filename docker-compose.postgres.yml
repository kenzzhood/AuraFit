# Local PostgreSQL with pgvector for Aurafit dev
# Start: docker compose -f docker-compose.postgres.yml up -d
# Stop:  docker compose -f docker-compose.postgres.yml down

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aurafit-pg
    restart: unless-stopped
    ports:
      - "54322:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: aurafit_local_dev
      POSTGRES_DB: postgres
    volumes:
      - aurafit_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aurafit_pg_data:
