  bewakoof:
    search_url_template: "https://www.bewakoof.com/search?q={query}"
    regions: [IN]
    priority: 3
    engine: playwright
  thesouledstore:
    search_url_template: "https://www.thesouledstore.com/search?q={query}"
    regions: [IN]
    priority: 3
    engine: playwright
  urbanic:
    search_url_template: "https://in.urbanic.com/search?q={query}"
