# Per-retailer crawl configuration (loaded by config/retailers.py)
#
# Wave 0 (priority 1): India marketplaces — always searched first, in parallel.
# Wave 1 (priority 2–3): brand / department stores.
# Wave 2 (priority 20): boutique Shopify brands. Easy to crawl from cloud IPs,
# so they used to fill the quota and hide Amazon / Myntra / Ajio. Last resort only.
retailers:
  amazon_in:
    search_url_template: "https://www.amazon.in/s?k={query}"
    regions: [IN]
    priority: 1
    engine: playwright
  myntra:
    search_url_template: "https://www.myntra.com/{slug_query}"
    regions: [IN]
    priority: 1
    engine: playwright
  ajio:
    search_url_template: "https://www.ajio.com/search/?text={query}"
    regions: [IN]
    priority: 1
    engine: playwright
  flipkart:
    search_url_template: "https://www.flipkart.com/search?q={query}"
    regions: [IN]
    priority: 1
    engine: playwright
  nykaa:
    search_url_template: "https://www.nykaafashion.com/search/result/?query={query}"
    regions: [IN]
    priority: 1
    engine: playwright
  tatacliq:
    search_url_template: "https://www.tatacliq.com/search/?searchCategory=all&text={query}"
    regions: [IN]
    priority: 1
    engine: playwright
  meesho:
    search_url_template: "https://www.meesho.com/search?q={query}"
    regions: [IN]
    priority: 1
    engine: playwright
  zara_in:
    search_url_template: "https://www.zara.com/in/en/search?searchTerm={query}"
    regions: [IN]
    priority: 2
    engine: playwright
  hm_in:
    search_url_template: "https://www2.hm.com/en_in/search-results.html?q={query}"
    regions: [IN]
    priority: 2
    engine: playwright
  uniqlo_in:
    search_url_template: "https://www.uniqlo.com/in/en/search?q={query}"
    regions: [IN]
    priority: 2
    engine: playwright
  asos:
    search_url_template: "https://www.asos.com/api/product/search/v2/?q={query}&channel=desktop-web&store=COM&limit=48"
    regions: [IN, US, UK]
    priority: 2
    engine: httpx
  westside:
    search_url_template: "https://www.westside.com/search?q={query}"
    regions: [IN]
    priority: 2
    engine: playwright
  lifestyle:
    search_url_template: "https://www.lifestylestores.com/in/en/search?q={query}"
    regions: [IN]
    priority: 2
    engine: playwright
  maxfashion:
    search_url_template: "https://www.maxfashion.in/in/en/search?q={query}"
    regions: [IN]
    priority: 2
    engine: playwright
  marksandspencer:
    search_url_template: "https://www.marksandspencer.in/search/?q={query}"
    regions: [IN]
    priority: 2
    engine: playwright
  shoppersstop:
    search_url_template: "https://www.shoppersstop.com/search?q={query}"
    regions: [IN]
